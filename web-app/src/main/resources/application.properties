server.port=8081

# ── Base de datos institucional ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/institucion_cursos
spring.datasource.username=flowable
spring.datasource.password=flowablepassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Flowable REST API ────────────────────────────────────────────────────────
flowable.rest.base-url=http://localhost:8080/flowable-ui
flowable.rest.user=admin
flowable.rest.password=test

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Seguridad: desactivar CSRF solo para endpoints de API interna ─────────────
# (El login usa los usuarios de Flowable IDM via REST)
logging.level.ar.edu.unrc=DEBUG
