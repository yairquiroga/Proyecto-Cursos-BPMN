<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Revisar Propuesta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; } </style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 650px;">
        <div class="card p-4 bg-white border-0 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="h5 fw-bold mb-0">Revisar Propuesta Solicitada</h3>
                <a href="/admin/tareas" class="btn btn-sm btn-outline-secondary">&larr; Volver</a>
            </div>
            <p class="text-muted small">La empresa solicitó modificaciones. Ajustá los términos y emití una nueva versión.</p>

            <form th:action="@{'/admin/tareas/' + ${tarea.id} + '/revisar'}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Programa Ajustado</label>
                    <textarea name="programa" class="form-control" rows="4" required>Módulo 1: Fundamentos actualizados. Módulo 2: Casos de uso específicos de la empresa.</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Nuevo Presupuesto ($ ARS)</label>
                    <input type="text" name="presupuesto" class="form-control" value="320000" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Nuevas Fechas Propuestas</label>
                    <input type="text" name="fechasDisponibles" class="form-control" value="Segunda quincena acordada" required>
                </div>

                <div class="mt-4 pt-3 border-top text-end">
                    <button type="submit" class="btn btn-warning px-4">Reenviar Propuesta Revisada</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
