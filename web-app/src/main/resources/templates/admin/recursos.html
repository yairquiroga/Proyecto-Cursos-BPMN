<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Evaluar Recursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; } </style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 600px;">
        <div class="card p-4 bg-white border-0 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="h5 fw-bold mb-0">Evaluar Necesidades de Recursos</h3>
                <a href="/admin/tareas" class="btn btn-sm btn-outline-secondary">&larr; Volver</a>
            </div>
            <p class="text-muted small">Seleccioná una o varias alternativas requeridas para el desarrollo del curso. El motor activará las ramas paralelas correspondientes.</p>

            <form th:action="@{'/admin/tareas/' + ${tarea.id} + '/recursos'}" method="post">
                <div class="list-group mb-4">
                    <label class="list-group-item d-flex gap-3 align-items-center py-3">
                        <input class="form-check-input flex-shrink-0" type="checkbox" name="reservarAula" value="true" checked>
                        <span>
                            <strong class="d-block text-dark">Reservar Aula Física</strong>
                            <small class="text-muted">Asigna aula física mediante el Web Service simulado de la universidad.</small>
                        </span>
                    </label>
                    <label class="list-group-item d-flex gap-3 align-items-center py-3">
                        <input class="form-check-input flex-shrink-0" type="checkbox" name="aulaVirtual" value="true">
                        <span>
                            <strong class="d-block text-dark">Solicitar Aula Virtual</strong>
                            <small class="text-muted">Crea entorno en plataforma virtual para actividades online.</small>
                        </span>
                    </label>
                    <label class="list-group-item d-flex gap-3 align-items-center py-3">
                        <input class="form-check-input flex-shrink-0" type="checkbox" name="equipamiento" value="true">
                        <span>
                            <strong class="d-block text-dark">Contratar Equipamiento Especial</strong>
                            <small class="text-muted">Gestiona proyectores, laptops adicionales o instrumental técnico.</small>
                        </span>
                    </label>
                </div>

                <div class="mt-4 pt-3 border-top text-end">
                    <button type="submit" class="btn btn-success px-4">Confirmar Selección de Recursos</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
