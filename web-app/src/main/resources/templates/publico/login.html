<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Capacitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
        .login-card { max-width: 420px; width: 100%; border-radius: 12px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .btn-primary { background-color: #1e3c72; border-color: #1e3c72; }
    </style>
</head>
<body>
    <div class="card login-card p-4 bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Acceso al Personal</h3>
            <p class="text-muted small">Ingresá con tu usuario y contraseña de Flowable IDM</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small">
            Credenciales inválidas. Por favor intentá nuevamente.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold">Usuario</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ej: jefe_admin, admin_2, jefe_docente" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label small fw-bold">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar</button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <a href="/" class="text-decoration-none small text-muted">&larr; Volver al inicio</a>
        </div>
    </div>
</body>
</html>
